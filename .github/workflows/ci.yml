name: Public core
on: [push, pull_request]
jobs:
  macos-arm64-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Check formatting
        continue-on-error: true
        run: npm run format:check
      - run: npm test
      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          node -e "if (process.arch !== 'arm64') process.exit(1)"
      - name: Use isolated macOS data directory
        run: |
          echo "DWB_DATA_DIR=$RUNNER_TEMP/dwb-data" >> "$GITHUB_ENV"
          echo "DWB_WORKER_ENTRY=$RUNNER_TEMP/dwb-data/external/desktop-commander/node_modules/@wonderwhy-er/desktop-commander/dist/index.js" >> "$GITHUB_ENV"
      - name: Install managed Desktop Commander 0.2.50
        run: npm run external:install-worker
      - run: npm run external:install-tunnel
      - run: npm run external:status
      - run: npm run test:integration
      - name: Test native macOS platform layer
        run: swift test --package-path macos/DWBPlatform
      - name: Build native SwiftUI shell
        run: swift build --package-path macos/DWBMCPStudioApp

  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Check formatting
        continue-on-error: true
        run: npm run format:check
      - run: npm test
      - name: Install external worker for integration tests
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/dwb-worker" --save-exact '@wonderwhy-er/desktop-commander@0.2.50'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DWB_WORKER_ENTRY=$env:RUNNER_TEMP/dwb-worker/node_modules/@wonderwhy-er/desktop-commander/dist/index.js" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run test:integration
      - run: npm run test:external
      - run: npm run test:upgrade
      - run: npm run test:runtime-upgrade
      - run: npm run test:setup
      - run: npm run test:tunnel
      - run: npm run build:launcher
      - run: npm run test:shell
      - run: npm run test:preferences
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-beta
          path: |
            releases/*.zip
            releases/*.sha256

      - name: Verify downloaded ZIP setup
        shell: pwsh
        run: |
          $zip = Get-ChildItem releases/*-windows.zip | Select-Object -First 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/release-test.ps1 -Zip $zip.FullName
